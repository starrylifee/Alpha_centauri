<circle cx="887" cy="211" r="7" fill="#c0392b"/>
<text x="902" y="216" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">바깥 궤도 — 외행성 (조난자)</text>
<circle cx="887" cy="233" r="7" fill="#e07b1f"/>
<text x="902" y="238" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">발사대 · 발사각 각도판 · 기준선</text>
<text x="880.0" y="270.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="20" fill="#c0392b" font-weight="bold">눈금 읽는 법</text>
<text x="880.0" y="292.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">바깥 눈금 = 조난자 위치.</text>
<text x="880.0" y="314.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">0°에서 진행 방향의 반대로 커집니다.</text>
<text x="880.0" y="336.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">조난자가 40에 있으면 기준선보다</text>
<text x="880.0" y="358.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">40도 뒤에 있다는 뜻입니다.</text>
<text x="880.0" y="390.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="20" fill="#e07b1f" font-weight="bold">발사각 각도판</text>
<text x="880.0" y="412.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">발사대 둘레 반원 = 로켓 머리 방향.</text>
<text x="880.0" y="434.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">정면이 90°, 정면으로 쏘면</text>
<text x="880.0" y="456.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">기준선 0°에 도착합니다.</text>
<text x="880.0" y="478.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">방향을 바꾸면 시험 발사로 확인.</text>
<text x="880.0" y="510.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="20" fill="#1f5fa8" font-weight="bold">발사 계산</text>
<text x="880.0" y="532.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">① 360 ÷ 외행성 주기(초) = 초당 각도</text>
<text x="880.0" y="554.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">② 초당 각도 × 로켓 비행 시간</text>
<text x="880.0" y="576.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">      = 리드 각도</text>
<text x="880.0" y="598.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">③ 조난자가 [도착 눈금 + 리드 각도]</text>
<text x="880.0" y="620.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">      눈금에 왔을 때 발사</text>
<text x="880.0" y="652.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="20" fill="#e07b1f" font-weight="bold">시작 전 확인</text>
<text x="880.0" y="674.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">· 로켓은 발사대에, 머리는 각도판</text>
<text x="880.0" y="696.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">   눈금에 맞춰 놓기</text>
<text x="880.0" y="718.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">· 같은 속도 기준 외행성 30초 /</text>
<text x="880.0" y="740.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">   내행성 20초 / 로켓 3초</text>
<text x="880.0" y="771" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="15" fill="#8a8f96">A0 1189 × 841 mm</text>
<text x="880.0" y="793" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="15" fill="#8a8f96">궤도선 검정 K100 · 폭 20 mm</text>
<text x="880.0" y="815" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="15" fill="#8a8f96">무광 인쇄 (광택 코팅 금지)</text>
