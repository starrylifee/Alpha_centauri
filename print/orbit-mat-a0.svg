<text x="880.0" y="656.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">· 세 로봇을 같은 속도로 두면 외행성</text>
<text x="880.0" y="680.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">   30초 / 내행성 20초 / 로켓 3초</text>
<text x="880.0" y="704.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">· 내행성이 발사선 위에 있으면</text>
