<text x="902" y="198" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">안쪽 궤도 — 내행성 (본부)</text>
<circle cx="887" cy="215" r="7" fill="#c0392b"/>
<text x="902" y="220" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">바깥 궤도 — 외행성 (조난자)</text>
<circle cx="887" cy="237" r="7" fill="#e07b1f"/>
<text x="902" y="242" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">가운데 발사 원 — 로켓 발사각</text>
<text x="880.0" y="278.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="20" fill="#c0392b" font-weight="bold">눈금 읽는 법</text>
<text x="880.0" y="300.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">눈금 두 개가 같은 각도를 씁니다.</text>
<text x="880.0" y="322.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">· 바깥 눈금 = 조난자 위치</text>
<text x="880.0" y="344.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">· 발사 원 눈금 = 로켓 발사각</text>
<text x="880.0" y="366.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">눈금은 0°에서 진행 방향의 반대로</text>
<text x="880.0" y="388.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">커집니다. 40°에 놓고 쏜 로켓은</text>
<text x="880.0" y="410.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">바깥 궤도 40°에 도착합니다.</text>
<text x="880.0" y="446.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="20" fill="#1f5fa8" font-weight="bold">발사 계산</text>
<text x="880.0" y="468.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">① 360 ÷ 외행성 주기(초)</text>
<text x="880.0" y="490.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">      = 초당 각도</text>
<text x="880.0" y="512.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">② 초당 각도 × 로켓 비행 시간</text>
<text x="880.0" y="534.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">      = 리드 각도</text>
<text x="880.0" y="556.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">③ 발사각을 하나 고른다 (예: 40°)</text>
<text x="880.0" y="578.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">④ 조난자가 [발사각 + 리드 각도]</text>
<text x="880.0" y="600.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">      눈금에 왔을 때 발사</text>
<text x="880.0" y="636.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="20" fill="#e07b1f" font-weight="bold">시작 전 확인</text>
<text x="880.0" y="658.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">· 로켓은 발사 원 눈금에 맞춰 놓고</text>
<text x="880.0" y="680.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">   머리를 바깥쪽으로</text>
<text x="880.0" y="702.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">· 같은 속도 기준 외행성 30초 /</text>
<text x="880.0" y="724.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">   내행성 20초 / 로켓 3초</text>
<text x="880.0" y="746.0" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="16" fill="#333">· 내행성과 부딪힐 것 같으면 한 박자</text>
<text x="880.0" y="771" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="15" fill="#8a8f96">A0 1189 × 841 mm</text>
<text x="880.0" y="793" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="15" fill="#8a8f96">궤도선 검정 K100 · 폭 20 mm</text>
<text x="880.0" y="815" font-family="'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif" font-size="15" fill="#8a8f96">무광 인쇄 (광택 코팅 금지)</text>
